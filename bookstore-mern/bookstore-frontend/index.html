<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Web Bán Sách - Bùi Anh Huy</title>
    <meta name="description" content="Hệ thống mua sắm sách trực tuyến hiện đại với nhiều ưu đãi hấp dẫn." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
      /* Cấu hình font chữ Inter cho toàn bộ web để nhìn sang hơn */
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
      }
      /* Hiệu ứng chuyển cảnh mượt mà cho các nút bấm và card */
      .transition-hover {
        transition: all 0.3s ease;
      }
      .transition-hover:hover {
        transform: translateY(-5px);
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
